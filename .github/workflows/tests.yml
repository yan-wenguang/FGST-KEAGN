name: Public supporting-material checks

on:
  push:
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"

permissions:
  contents: read

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the recorded public dependencies and package
        run: |
          python -m pip install pip==25.3 setuptools==75.8.2 wheel==0.45.1
          python -m pip install -r requirements-core.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Test public input contracts and synthetic example
        run: |
          python -m unittest discover -s tests -v
          python -m examples.generate
          python -m examples.run --config configs/synthetic_example.json
          python -m src.pipelines.run_full_pipeline --config configs/core_demo.yaml
