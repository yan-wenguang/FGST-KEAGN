seed: 42
data:
  csv_path: examples/synthetic.csv
  label_column: label
  train_ratio: 0.60
  val_ratio: 0.20
  test_ratio: 0.20
  dynamic_context_columns: [context_level]
stage1:
  num_heads: 2
  hidden_dim: 8
  dropout: 0.10
  alpha_balance: 0.55
  temperature: 0.25
  sparse_weight: 0.006
  learning_rate: 0.003
  weight_decay: 0.0001
  epochs: 3
  max_features: 3
  min_features: 2
  redundancy_penalty: 0.50
  mi_bins: 6
  synergy_cv_max_iter: 100
stage2:
  hidden_dim: 16
  context_dim: 8
  learning_rate: 0.002
  weight_decay: 0.0001
  epochs: 3
  batch_size: 64
  align_weight: 0.10
  context_weight: 0.05
  context_kernel_gamma: 0.75
knowledge:
  feature_metadata_path: configs/core_feature_metadata.json
  feature_cards_path: artifacts/core_demo/feature_cards.json
  priors_path: configs/core_demo_priors.json
artifacts:
  stage1_dir: artifacts/core_demo/stage1
  stage2_dir: artifacts/core_demo/stage2
  reports_dir: artifacts/core_demo/reports
